# GoReleaser skeleton (architecture handoff section 17, Phase 1).
#
# Cross-compiles ovl-vessel for the required OS/arch matrix with a signed
# checksum file, and builds and pushes a multi-arch ovl-office container
# image. Wired into CI via .github/workflows/release.yaml on a version
# tag push (Phase 7).
version: 2

project_name: ovl

before:
  hooks:
    - go mod tidy

builds:
  - id: ovl-vessel
    main: ./vessel
    binary: ovl-vessel
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{ .Version }} -X main.commit={{ .Commit }} -X main.date={{ .Date }}

archives:
  - id: ovl-vessel-archive
    ids: [ovl-vessel]
    name_template: >-
      {{ .Binary }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: "checksums.txt"

# Keyless cosign signing (sigstore) rather than a long-lived GPG key: no
# key custody burden, and it is the modern default for OSS Go releases.
# Only produces a valid signature when run from an OIDC-capable CI
# identity (e.g. GitHub Actions) — inert for a local/manual release.
signs:
  - cmd: cosign
    signature: "${artifact}.sig"
    certificate: "${artifact}.pem"
    args:
      - sign-blob
      - "--yes"
      - "--output-signature=${signature}"
      - "--output-certificate=${certificate}"
      - "${artifact}"
    artifacts: checksum

# ovl-office is deployed via Docker Compose (architecture 12.1), not a
# cross-compiled binary. dockers_v2 (not the older dockers/docker_manifests
# pair, which GoReleaser is phasing out) builds and pushes one
# multi-platform manifest per entry via buildx.
dockers_v2:
  - id: ovl-office
    dockerfile: office/Dockerfile
    images:
      - ghcr.io/captv89/ovl-office
    tags:
      - "{{ .Version }}"
      - latest
    platforms:
      - linux/amd64
      - linux/arm64
    # dockers_v2 has no "context: ." option (unlike the legacy dockers/
    # docker_manifests pair) — its build context is only the Dockerfile's
    # own directory plus whatever extra_files lists, copied in relative
    # to the repo root. office/Dockerfile's COPY . . needs the whole Go
    # module (go.mod/go.sum + every package office imports, including
    # internal/ and schemas/) and the web/office npm workspace, matching
    # that Dockerfile's own "build context is the repo root" doc comment.
    extra_files:
      - go.mod
      - go.sum
      - package.json
      - package-lock.json
      - cmd
      - internal
      - office
      - pkg
      - schemas
      - web

release:
  github:
    owner: captv89
    name: ovl
  draft: true
